<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PFI HRM System — Full Module Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --purple:#B8912C;
    --purple-dark:#8A6A1D;
    --blue:#2563EB;
    --blue-light:#EAF2FF;
    --gold-bg:#F3E4C0;
    --gold-icon:#A97C1E;
    --green-bg:#D1FAE5;
    --green:#16A34A;
    --orange-bg:#FEF3C7;
    --orange:#B45309;
    --red-bg:#FEE2E2;
    --red:#DC2626;
    --blue-bg:#DBEAFE;
    --pink-bg:#FCE7F3;
    --pink:#DB2777;
    --text:#1F2937;
    --muted:#6B7280;
    --border:#E5E7EB;
    --bg:#F5F6F8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;flex-direction:column;height:100vh;}
  .topbar{background:linear-gradient(90deg,var(--purple-dark),var(--purple));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;flex-shrink:0;}
  .topbar-left{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;}
  .topbar-left .app-name{opacity:.95;}
  .topbar-left .app-sub{opacity:.75;font-weight:400;font-size:13px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar-right .avatar{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .badge-demo{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:11px;padding:3px 9px;border-radius:20px;}
  .body-row{display:flex;flex:1;min-height:0;}
  .sidebar{width:230px;background:#fff;border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 16px 8px;}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .brand .name{font-weight:700;font-size:16px;}
  .section-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:14px 10px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text);margin-bottom:2px;}
  .nav-item:hover{background:#F7F5FA;}
  .nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:600;}
  .nav-item .icn{width:24px;height:24px;border-radius:6px;background:var(--gold-bg);color:var(--gold-icon);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .nav-item.active .icn{background:var(--blue);color:#fff;}
  .sub-nav{margin-left:26px;border-left:2px solid var(--border);padding-left:12px;margin-bottom:4px;}
  .sub-item{padding:7px 6px;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;}
  .sub-item:hover{color:var(--text);}
  .sub-item.active{color:var(--blue);font-weight:600;}
  .sub-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;}
  .sub-item.active .dot{background:var(--blue);}
  .main{flex:1;overflow-y:auto;padding:22px 28px;}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;}
  .crumb b{color:var(--text);font-size:15px;}
  .h1{font-size:22px;font-weight:700;margin:2px 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:#1d4fd1;}
  .btn-outline{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-outline:hover{background:#F7F7F8;}
  .btn-row{display:flex;gap:10px;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card .label{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;}
  .card .icon-circle{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .card .num{font-size:28px;font-weight:800;margin:6px 0 2px;}
  .card .delta{font-size:12px;font-weight:600;}
  .delta.up{color:var(--green);}
  .delta.down{color:var(--red);}
  .delta span{color:var(--muted);font-weight:400;margin-left:2px;}
  .panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-title{font-size:16px;font-weight:700;}
  .link{color:var(--blue);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;}
  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filters input,.filters select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;background:#fafafa;min-width:120px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--border);}
  td{padding:12px 12px;border-bottom:1px solid #F0F0F1;}
  tr:last-child td{border-bottom:none;}
  .pill{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-block;}
  .pill.green{background:var(--green-bg);color:var(--green);}
  .pill.orange{background:var(--orange-bg);color:var(--orange);}
  .pill.red{background:var(--red-bg);color:var(--red);}
  .pill.blue{background:var(--blue-bg);color:var(--blue);}
  .pill.gray{background:#F1F1F3;color:var(--muted);}
  .avatar-name{display:flex;align-items:center;gap:8px;}
  .avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text);}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;background:#fafafa;font-family:inherit;}
  .field textarea{resize:vertical;min-height:70px;}
  .field.full{grid-column:1/-1;}
  .upload-box{border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:13px;background:#FAFAFA;}
  .upload-box b{color:var(--blue);cursor:pointer;}
  .profile-head{display:flex;gap:18px;align-items:center;margin-bottom:18px;}
  .profile-photo{width:76px;height:76px;border-radius:16px;background:var(--purple);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .profile-name{font-size:19px;font-weight:700;}
  .profile-role{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--blue);border-color:var(--blue);}
  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .info-item .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .info-item .v{font-size:13.5px;font-weight:600;}
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kanban-col{background:#FAFAFA;border-radius:12px;padding:12px;border:1px solid var(--border);}
  .kanban-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:2px 0 10px;display:flex;justify-content:space-between;}
  .kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .kcard .kname{font-weight:700;margin-bottom:3px;}
  .kcard .kmeta{color:var(--muted);font-size:11.5px;}
  .progress-bar{height:6px;background:#EEE;border-radius:4px;overflow:hidden;margin-top:6px;}
  .progress-bar > div{height:100%;background:var(--blue);}
  .row-actions{display:flex;gap:8px;}
  .row-actions a{color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;}
  .doc-icon{width:34px;height:34px;border-radius:8px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
  .stars{color:#F59E0B;font-size:13px;}
</style>
</head>

let state = {page:"home"};

function renderSidebar(){
  const el = document.getElementById("sidebar");
  el.innerHTML = "";
  const brand = document.createElement("div");
  brand.className = "brand";
  brand.innerHTML = `<div class="logo">HR</div><div class="name">HRM</div>`;
  el.appendChild(brand);

  NAV.forEach(item=>{
    if(item.group){
      const g = document.createElement("div");
      g.className="section-label"; g.textContent=item.group;
      el.appendChild(g);
      return;
    }
    const active = state.page===item.key || (item.subs && item.subs.some(s=>s.key===state.page));
    const nav = document.createElement("div");
    nav.className = "nav-item"+(active?" active":"");
    nav.innerHTML = `<span class="icn">${item.icon}</span><span>${item.label}</span>`;
    nav.onclick = ()=>{ go(item.subs ? item.subs[0].key : item.key); };
    el.appendChild(nav);
    if(item.subs && active){
      const sub = document.createElement("div");
      sub.className="sub-nav";
      item.subs.forEach(s=>{
        const si = document.createElement("div");
        si.className = "sub-item"+(state.page===s.key?" active":"");
        si.innerHTML = `<span class="dot"></span><span>${s.label}</span>`;
        si.onclick = (e)=>{ e.stopPropagation(); go(s.key); };
        sub.appendChild(si);
      });
      el.appendChild(sub);
    }
  });
}

function go(page){ state.page = page; render(); window.scrollTo(0,0); }

function render(){
  renderSidebar();
  const main = document.getElementById("main");
  main.innerHTML = PAGES[state.page] ? PAGES[state.page]() : `<div class="panel">Screen not built yet.</div>`;
}

// ---------- helpers ----------
function cardsHTML(cards){
  return `<div class="cards">${cards.map(c=>`
    <div class="card">
      <div class="icon-circle" style="background:${c.bg};color:${c.fg}">${c.icon}</div>
      <div class="label">${c.label}</div>
      <div class="num">${c.num}</div>
      <div class="delta ${c.dir}">${c.dir==="up"?"↑":"↓"} ${c.delta} <span>${c.deltaLabel||""}</span></div>
    </div>`).join("")}</div>`;
}
function header(crumbTrail,title,sub,actions){
  return `<div class="page-header">
    <div>
      <div class="crumb">${crumbTrail}</div>
      <div class="h1">${title}</div>
      ${sub?`<div class="sub">${sub}</div>`:""}
    </div>
    <div class="btn-row">${actions||""}</div>
  </div>`;
}
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
